name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Run test suite
        run: npm test -- --run

      - name: Build project
        run: npm run build

      - name: Validate workspace graph
        run: npm ls --workspaces --depth=0

      - name: Check patch formatting
        run: git diff --check
